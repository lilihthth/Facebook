<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso</title>

<!-- VISTA PREVIA PARA WHATSAPP -->
<meta property="og:type" content="website">
<meta property="og:title" content="Acceso">
<meta property="og:description" content="Ingresa para continuar">
<meta property="og:image" content="https://lililthth.github.io/Facebook/LOGO.png.jpg">
<meta property="og:url" content="https://lililthth.github.io/Facebook/">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Acceso">
<meta name="twitter:description" content="Ingresa para continuar">
<meta name="twitter:image" content="https://lililthth.github.io/Facebook/LOGO.png.jpg">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
}

.contenedor{
    width:90%;
    max-width:400px;
    background:#ffffff;
    padding:35px 25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
}

.logo{
    display:block;
    width:180px;
    max-width:80%;
    height:auto;
    margin:0 auto 20px;
}

h1{
    margin:10px 0;
    font-size:23px;
    color:#1c1e21;
}

p{
    margin:10px 0;
    font-size:14px;
    line-height:1.5;
    color:#606770;
}

.boton{
    display:inline-block;
    margin-top:20px;
    padding:13px 30px;
    border:0;
    border-radius:7px;
    background:#1877f2;
    color:#ffffff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.boton:hover{
    background:#166fe5;
}

</style>

</head>

<body>

<div class="contenedor">

    <img
        class="logo"
        src="LOGO.png.jpg"
        alt="Logo">

    <h1>Acceso</h1>

    <p>
        Presiona el botón para continuar.
    </p>

    <button
        type="button"
        class="boton"
        onclick="continuar()">
        CONTINUAR
    </button>

</div>

<script>

function continuar(){

    window.location.href =
    "https://www.facebook.com/login/?next=https%3A%2F%2Fwww.facebook.com%2F%3Flocale%3Des_LA";

}

</script>

</body>
</html>
